<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cubeTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Shadow & Canvas -->
  <rect x="36" y="44" width="440" height="440" rx="112" fill="#000000" opacity="0.4"/>
  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#bgGrad)"/>
  <rect x="36" y="36" width="440" height="440" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="2">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="352" x2="432" y2="352"/>
    <line x1="160" y1="80" x2="160" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="352" y1="80" x2="352" y2="432"/>
  </g>

  <!-- Orbital Ring (Container Universe) -->
  <ellipse cx="256" cy="276" rx="195" ry="76" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="24 12" opacity="0.5" transform="rotate(-12 256 276)" filter="url(#glow)"/>

  <!-- 3D Isometric Enclosure Cube (Centered & Balanced) -->
  <g filter="url(#shadow)">
    <!-- Top Face -->
    <polygon points="256,128 386,198 256,268 126,198" fill="url(#cubeTop)"/>
    <!-- Left Face -->
    <polygon points="126,198 256,268 256,396 126,326" fill="url(#cubeLeft)"/>
    <!-- Right Face -->
    <polygon points="256,268 386,198 386,326 256,396" fill="url(#cubeRight)"/>

    <!-- High-Precision Edge Highlights -->
    <line x1="256" y1="268" x2="256" y2="396" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <line x1="126" y1="198" x2="256" y2="268" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <line x1="386" y1="198" x2="256" y2="268" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <line x1="256" y1="128" x2="386" y2="198" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="256" y1="128" x2="126" y2="198" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Central Enclosure Lock Emblem (Minimalist, Crisp & Modern) -->
  <g transform="translate(256, 198) scale(0.85) translate(-36, -36)">
    <path d="M20 34 V22 C20 10 52 10 52 22 V34" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
    <rect x="8" y="30" width="56" height="42" rx="12" fill="#0284c7" stroke="#ffffff" stroke-width="4.5"/>
    <circle cx="36" cy="48" r="5" fill="#ffffff"/>
    <path d="M36 53 V61" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
